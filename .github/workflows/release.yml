name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin

      - name: Install roudan-core
        run: |
          git clone --depth=1 https://github.com/wsaaaqqq/roudan-core.git /tmp/roudan-core
          cd /tmp/roudan-core
          mvn install -DskipTests -q || true

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/roudan-jdbc-cli.jar
          generate_release_notes: true
