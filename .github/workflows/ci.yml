name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [8, 11, 17]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Install roudan-core
        run: |
          git clone --depth=1 https://github.com/wsaaaqqq/roudan-core.git /tmp/roudan-core
          cd /tmp/roudan-core
          # Use locally installed jar if roudan-core build fails
          mvn install -DskipTests -q || true

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Run tests
        run: mvn -B test

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: roudan-jdbc-cli-jdk${{ matrix.java }}.jar
          path: target/roudan-jdbc-cli.jar
